name: validate, build, deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: '17 5 * * *' }]   # nightly store-status refresh
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Refresh store status (nightly only)
        if: github.event_name == 'schedule'
        run: |
          node tools/refresh-store-status.mjs --write
          if [ -n "$(git status --porcelain catalog)" ]; then
            git config user.name "app-store-bot"; git config user.email "bot@users.noreply.github.com"
            git add catalog && git commit -m "Nightly store status refresh" && git push
          fi
      - name: Image tools (webp variants, OG images)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp ffmpeg
      - uses: actions/cache@v4
        with:
          path: .cache
          key: images-${{ hashFiles('assets/**', 'tools/lib/images.mjs') }}
          restore-keys: images-
      - run: node tools/validate-catalog.mjs
      - run: node tools/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
